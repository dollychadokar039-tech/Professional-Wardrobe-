<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wishlist</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<nav>

    <h2>Professional Wardrobe</h2>

    <ul>

        <li><a href="index.html">Home</a></li>

        <li><a href="men.html">Men</a></li>

        <li><a href="women.html">Women</a></li>

        <li><a href="wishlist.html">Wishlist</a></li>

        <li><a href="cart.html">Cart</a></li>

    </ul>

</nav>

<section class="wishlist">

    <h1>❤️ My Wishlist</h1>

    <p>Your favourite office outfits.</p>

    <div class="wishlist-container">

        <div class="wishlist-item">

            <img src="images/office.png" alt="Shirt">

            <div class="wishlist-details">

                <h3>White Formal Shirt</h3>

                <p>₹899</p>

            </div>

            <button class="move-cart">

                Move to Cart

            </button>

            <button class="delete-item">

                Remove

            </button>

        </div>
        <div class="wishlist-item">

            <img src="images/office.png" alt="Trouser">

            <div class="wishlist-details">

                <h3>Black Formal Trouser</h3>

                <p>₹1499</p>

            </div>

            <button class="move-cart">

                Move to Cart

            </button>

            <button class="delete-item">

                Remove

            </button>

        </div>

        <div class="wishlist-item">

            <img src="images/office.png" alt="Shoes">

            <div class="wishlist-details">

                <h3>Leather Oxford Shoes</h3>

                <p>₹2499</p>

            </div>

            <button class="move-cart">

                Move to Cart

            </button>

            <button class="delete-item">

                Remove

            </button>

        </div>

    </div>

    <div class="empty-message">

        <h2>Your Wishlist is Empty ❤️</h2>

        <p>Add your favourite office essentials from the homepage.</p>

        <a href="index.html">

            <button class="shop-btn">

                Continue Shopping

            </button>

        </a>

    </div>

</section>

<script src="wishlist.js"></script>

</body>

</html>
