<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<nav>

    <h2>Professional Wardrobe</h2>

    <ul>

        <li><a href="index.html">Home</a></li>

        <li><a href="login.html">Login</a></li>

    </ul>

</nav>

<section class="login-page">

    <div class="login-box">

        <h2>Create Account</h2>

        <input
                type="text"
                id="name"
                placeholder="Full Name">

        <input
                type="email"
                id="email"
                placeholder="Email">

        <input
                type="password"
                id="password"
                placeholder="Password">

        <button id="signupBtn">

            Create Account

        </button>

        <p>

            Already have an account?

            <a href="login.html">

                Login

            </a>

        </p>

    </div>

</section>

<script src="signup.js"></script>

</body>

</html>
