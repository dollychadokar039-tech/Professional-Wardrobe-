<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<nav>

    <h2>Professional Wardrobe</h2>

    <ul>

        <li><a href="index.html">Home</a></li>

        <li><a href="signup.html">Sign Up</a></li>

    </ul>

</nav>

<section class="login-page">

    <div class="login-box">

        <h2>Login</h2>

        <input
                type="email"
                id="loginEmail"
                placeholder="Enter Email">

        <input
                type="password"
                id="loginPassword"
                placeholder="Enter Password">

        <button id="loginBtn">

            Login

        </button>

        <p>

            Don't have an account?

            <a href="signup.html">

                Create Account

            </a>

        </p>

    </div>

</section>

<script src="login.js"></script>

</body>

</html>
